name: Build Rajasthan BLO Directory APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-rajasthan-blo.yml"
      - "RajasthanBLODirectory_Project*.zip"

permissions:
  contents: read

jobs:
  build-blo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: locate-zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'RajasthanBLODirectory_Project*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No RajasthanBLODirectory_Project*.zip found in the repository root."
            echo "Upload the project ZIP at the root, keeping its name starting with RajasthanBLODirectory_Project."
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using project ZIP: $ZIP_FILE"

      - name: Extract project
        shell: bash
        env:
          ZIP_FILE: ${{ steps.locate-zip.outputs.zip_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/blo-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/blo-project"
          ANDROID_PROJECT_DIR="$(find "$RUNNER_TEMP/blo-project" -path '*/android/settings.gradle.kts' -print -quit | xargs -r dirname)"
          if [ -z "$ANDROID_PROJECT_DIR" ]; then
            echo "::error::Could not find android/settings.gradle.kts inside the uploaded ZIP."
            echo "Check that you uploaded the full RajasthanBLODirectory_Project ZIP."
            find "$RUNNER_TEMP/blo-project" -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$ANDROID_PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p "$ANDROID_PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rajasthan-BLO-Directory-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
