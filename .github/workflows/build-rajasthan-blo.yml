name: Build Rajasthan BLO Directory APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-rajasthan-blo.yml"
      - "RajasthanBLODirectory_Project*.zip"

permissions:
  contents: read

jobs:
  build-blo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: locate-zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'RajasthanBLODirectory_Project*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No RajasthanBLODirectory_Project*.zip found in the repository root."
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using project ZIP: $ZIP_FILE"

      - name: Extract project
        shell: bash
        env:
          ZIP_FILE: ${{ steps.locate-zip.outputs.zip_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/blo-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/blo-project"
          ANDROID_PROJECT_DIR="$(find "$RUNNER_TEMP/blo-project" -path '*/android/settings.gradle.kts' -print -quit | xargs -r dirname)"
          if [ -z "$ANDROID_PROJECT_DIR" ]; then
            echo "::error::Could not find android/settings.gradle.kts inside the uploaded ZIP."
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$ANDROID_PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_PROJECT_DIR"

      - name: Install ERO offline data asset
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$ANDROID_PROJECT_DIR/app/src/main/assets"
          mkdir -p "$ASSET_DIR"
          printf 'Name,User ID,Status,Officer Type,District,Assembly,Office Address,Mobile No.,Landline,E-mail\n' > "$ASSET_DIR/ero_directory.csv"
          for PART in "$GITHUB_WORKSPACE"/ero_directory_part*.csv; do
            while IFS= read -r LINE || [ -n "$LINE" ]; do
              printf '%s\n' "$LINE" >> "$ASSET_DIR/ero_directory.csv"
            done < "$PART"
          done
          test "$(wc -l < "$ASSET_DIR/ero_directory.csv")" -eq 201
          echo "ERO dataset rows: $(($(wc -l < "$ASSET_DIR/ero_directory.csv") - 1))"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Repair and validate Android sources
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$ANDROID_PROJECT_DIR/app"
          MAIN="$APP_DIR/src/main/java/in/rajasthan/election/blo/MainActivity.kt"
          DB="$APP_DIR/src/main/java/in/rajasthan/election/blo/BloDatabase.kt"
          test -f "$MAIN"
          test -f "$DB"
          test -f "$APP_DIR/src/main/assets/blo_directory.csv"
          test -f "$APP_DIR/src/main/assets/ero_directory.csv"
          sed -i 's/^package in\.rajasthan\.election\.blo$/package com.rajasthan.election.blo/' "$MAIN" "$DB"
          sed -i 's/namespace = "in\.rajasthan\.election\.blo"/namespace = "com.rajasthan.election.blo"/' "$APP_DIR/build.gradle.kts"
          sed -i 's/applicationId = "in\.rajasthan\.election\.blo"/applicationId = "com.rajasthan.election.blo"/' "$APP_DIR/build.gradle.kts"
          cat > "$MAIN" <<'KOTLIN'
          package com.rajasthan.election.blo

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Call
          import androidx.compose.material.icons.filled.Search
          import androidx.compose.material.icons.filled.Tune
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.launch

          private val Navy = Color(0xFF173B7A)
          private val NavyDark = Color(0xFF0B2857)
          private val Blue = Color(0xFF173B7A)
          private val Saffron = Color(0xFFF4A000)
          private val Pale = Color(0xFFF4F6F9)
          private val Muted = Color(0xFF667085)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.rgb(16, 42, 67)
                  window.navigationBarColor = android.graphics.Color.rgb(16, 42, 67)
                  setContent { DirectoryApp(BloDatabase.get(this)) }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun DirectoryApp(db: BloDatabase) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var hindi by remember { mutableStateOf(false) }
              var selectedTab by remember { mutableStateOf("BLO") }
              var query by remember { mutableStateOf("") }
              var district by remember { mutableStateOf("") }
              var assembly by remember { mutableStateOf("") }
              var part by remember { mutableStateOf("") }
              var districts by remember { mutableStateOf(emptyList<String>()) }
              var eroDistricts by remember { mutableStateOf(emptyList<String>()) }
              var assemblies by remember { mutableStateOf(emptyList<AssemblyOption>()) }
              var eroAssemblies by remember { mutableStateOf(emptyList<String>()) }
              var parts by remember { mutableStateOf(emptyList<PartOption>()) }
              var rows by remember { mutableStateOf(emptyList<BloRecord>()) }
              var matchingTotal by remember { mutableIntStateOf(0) }
              var total by remember { mutableIntStateOf(0) }
              var eroTotal by remember { mutableIntStateOf(0) }
              var districtOpen by remember { mutableStateOf(false) }
              var assemblyOpen by remember { mutableStateOf(false) }
              var partOpen by remember { mutableStateOf(false) }
              var loading by remember { mutableStateOf(true) }
              var hasSearched by remember { mutableStateOf(false) }
              var showResults by remember { mutableStateOf(false) }

              suspend fun runSearch() {
                  val term = query.trim()
                  if (selectedTab == "BLO") {
                      // Preserve the approved BLO search path and its exact filters.
                      if (term.isBlank() && district.isBlank() && assembly.isBlank() && part.isBlank()) {
                          rows = emptyList(); matchingTotal = 0
                      } else {
                          matchingTotal = db.dao().countSearch(term, district, assembly, part)
                          rows = db.dao().search(term, district, assembly, part, 150, 0)
                      }
                  } else {
                      if (term.isBlank() && district.isBlank() && assembly.isBlank()) {
                          rows = emptyList(); matchingTotal = 0
                      } else {
                          matchingTotal = db.dao().countEroSearch(term, district, assembly)
                          rows = db.dao().searchEro(term, district, assembly, 150, 0).map { ero ->
                              BloRecord(id=ero.id, district=ero.district, acNumber="", assemblyName=ero.assembly,
                                  partNo=ero.userId, partName=ero.officeAddress, bloName=ero.name,
                                  designation="Electoral Registration Officer (ERO)", mobileNumber=ero.mobile,
                                  email=ero.email, landline=ero.landline)
                          }
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  // CSV is streamed into Room in batches; no 300-record result list is
                  // loaded into the home screen. Only lightweight counts and districts
                  // are read until the user requests a search.
                  seedFromAssets(context, db)
                  seedEroFromAssets(context, db)
                  total = db.dao().count()
                  eroTotal = db.dao().countEro()
                  districts = db.dao().districts()
                  eroDistricts = db.dao().eroDistricts()
                  rows = emptyList()
                  loading = false
              }

              MaterialTheme(
                  colorScheme = lightColorScheme(
                      primary = Navy,
                      secondary = Saffron,
                      tertiary = Blue,
                      background = Pale,
                      surface = Color.White
                  ),
                  typography = Typography()
              ) {
                  Scaffold(
                      containerColor = Pale,
                      topBar = {
                          Column(
                              modifier = Modifier.fillMaxWidth().background(Navy)
                                  .statusBarsPadding()
                          ) {
                              Box(Modifier.fillMaxWidth().height(4.dp).background(Saffron))
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth().padding(start = 16.dp, end = 12.dp, top = 12.dp, bottom = 12.dp)) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text("RAJASTHAN", color = Color(0xFFFFC16B), style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.Bold)
                                      Text(if (hindi) "BLO और ERO निर्देशिका" else "BLO and ERO Directory", color = Color.White, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)
                                      Text(if (hindi) "निर्वाचन विभाग, राजस्थान" else "Election Department • Rajasthan", color = Color(0xFFD6E2EC), style = MaterialTheme.typography.bodySmall)
                                  }
                                  TextButton(onClick = { hindi = !hindi }) {
                                      Text(if (hindi) "ENGLISH" else "हिन्दी", color = Color.White, fontWeight = FontWeight.Bold)
                                  }
                              }
                              Spacer(Modifier.height(14.dp))
                              Row(
                                  modifier = Modifier.fillMaxWidth().background(Color.White.copy(alpha = 0.10f), RoundedCornerShape(12.dp)).padding(12.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(if (selectedTab == "BLO") (if (hindi) "मतदान केंद्र सहायता" else "POLLING STATION ASSISTANCE") else (if (hindi) "विधानसभा अधिकारी निर्देशिका" else "ASSEMBLY OFFICER DIRECTORY"), color = Color(0xFFFFC16B), style = MaterialTheme.typography.labelSmall, fontWeight = FontWeight.Bold)
                                      Text(if (selectedTab == "BLO") (if (hindi) "अपना बूथ और BLO आसानी से खोजें" else "Find your booth and BLO in seconds") else (if (hindi) "जिले और विधानसभा से ERO खोजें" else "Find your ERO by district and assembly"), color = Color.White, style = MaterialTheme.typography.bodyMedium)
                                  }
                                  Surface(color = Saffron, shape = RoundedCornerShape(10.dp)) {
                                      Text(selectedTab, color = Navy, modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp), fontWeight = FontWeight.ExtraBold)
                                  }
                              }
                              Row(modifier = Modifier.fillMaxWidth().padding(top = 12.dp, bottom = 12.dp), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  listOf("BLO", "ERO").forEach { tab ->
                                      val active = selectedTab == tab
                                      Button(onClick = {
                                          if (selectedTab != tab) {
                                              selectedTab = tab
                                              query = ""; district = ""; assembly = ""; part = ""
                                              assemblies = emptyList(); eroAssemblies = emptyList(); parts = emptyList()
                                              rows = emptyList(); matchingTotal = 0; hasSearched = false; showResults = false
                                              scope.launch { districts = if (tab == "BLO") db.dao().districts() else db.dao().eroDistricts() }
                                          }
                                      }, modifier = Modifier.weight(1f),
                                          colors = ButtonDefaults.buttonColors(containerColor = if (active) Saffron else Color.White.copy(alpha = 0.12f), contentColor = if (active) NavyDark else Color.White),
                                          shape = RoundedCornerShape(12.dp)) {
                                          Text(if (tab == "BLO") (if (hindi) "BLO • बूथ स्तर" else "BLO • Booth Level") else (if (hindi) "ERO • विधानसभा स्तर" else "ERO • Assembly Level"), fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  ) { inset ->
                      if (!showResults) {
                  Column(
                          modifier = Modifier.fillMaxSize().padding(inset).padding(horizontal = 16.dp).verticalScroll(rememberScrollState()),
                          verticalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          Spacer(Modifier.height(2.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxWidth()) {
                              ElevatedCard(modifier = Modifier.weight(1f), shape = RoundedCornerShape(14.dp), colors = CardDefaults.elevatedCardColors(containerColor = Color.White), elevation = CardDefaults.elevatedCardElevation(defaultElevation = 1.dp)) {
                                  Column(Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 12.dp)) {
                                      Text((if (selectedTab == "BLO") total else eroTotal).toString(), color = Navy, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)
                                      Text(if (selectedTab == "BLO") (if (hindi) "BLO रिकॉर्ड" else "BLO Records") else (if (hindi) "ERO रिकॉर्ड" else "ERO Records"), color = Muted, style = MaterialTheme.typography.labelMedium)
                                  }
                              }
                              ElevatedCard(modifier = Modifier.weight(1f), shape = RoundedCornerShape(14.dp), colors = CardDefaults.elevatedCardColors(containerColor = Color.White), elevation = CardDefaults.elevatedCardElevation(defaultElevation = 1.dp)) {
                                  Column(Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 12.dp)) {
                                      Text(districts.size.toString(), color = Navy, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)
                                      Text(if (hindi) "जिले" else "Districts", color = Muted, style = MaterialTheme.typography.labelMedium)
                                  }
                              }
                          }
                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth()) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(if (hindi) "अपना क्षेत्र चुनें" else "Select your area", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold, color = Navy)
                                  Text(if (hindi) "जिला से भाग तक क्रमवार चुनें" else "Choose District → Assembly → Part", style = MaterialTheme.typography.bodySmall, color = Muted)
                              }
                              Surface(color = Color(0xFFE0F2E8), shape = RoundedCornerShape(20.dp)) {
                                  Text(if (hindi) "ऑफ़लाइन" else "OFFLINE", color = Color(0xFF176B45), style = MaterialTheme.typography.labelSmall, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 10.dp, vertical = 7.dp))
                              }
                          }

                          ElevatedCard(
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(18.dp),
                              colors = CardDefaults.elevatedCardColors(containerColor = Color.White),
                              elevation = CardDefaults.elevatedCardElevation(defaultElevation = 2.dp)
                          ) {
                              Column(modifier = Modifier.fillMaxWidth().padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Icon(Icons.Default.Tune, contentDescription = null, tint = Blue)
                                      Spacer(Modifier.width(8.dp))
                                      Text(if (selectedTab == "BLO") (if (hindi) "क्षेत्र फ़िल्टर" else "LOCATION FILTERS") else (if (hindi) "ERO क्षेत्र फ़िल्टर" else "ERO LOCATION FILTERS"), color = Navy, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.labelLarge)
                                  }

                                  Box {
                                      OutlinedButton(onClick = { districtOpen = true }, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp), contentPadding = PaddingValues(horizontal = 12.dp, vertical = 13.dp)) {
                                          Column(modifier = Modifier.weight(1f), horizontalAlignment = Alignment.Start) {
                                              Text(if (hindi) "जिला *" else "DISTRICT *", style = MaterialTheme.typography.labelSmall, color = Muted)
                                              Text(district.ifBlank { if (hindi) "जिला चुनें" else "Select district" }, color = Navy, fontWeight = FontWeight.Medium)
                                          }
                                          Text("⌄", color = Blue, style = MaterialTheme.typography.titleLarge)
                                      }
                                      DropdownMenu(expanded = districtOpen, onDismissRequest = { districtOpen = false }, modifier = Modifier.heightIn(max = 320.dp)) {
                                          districts.forEach { item ->
                                              DropdownMenuItem(text = { Text(item) }, onClick = {
                                                  district = item; assembly = ""; part = ""; assemblies = emptyList(); eroAssemblies = emptyList(); parts = emptyList(); rows = emptyList(); matchingTotal = 0; hasSearched = false; districtOpen = false
                                                  scope.launch {
                                                      if (selectedTab == "BLO") assemblies = db.dao().assembliesForDistrict(district)
                                                      else eroAssemblies = db.dao().eroAssembliesForDistrict(district)
                                                  }
                                              })
                                          }
                                      }
                                  }

                                  if (selectedTab == "BLO") {

                                  Box {
                                      OutlinedButton(onClick = { if (district.isNotBlank()) assemblyOpen = true }, enabled = district.isNotBlank(), modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp), contentPadding = PaddingValues(horizontal = 12.dp, vertical = 13.dp)) {
                                          Column(modifier = Modifier.weight(1f), horizontalAlignment = Alignment.Start) {
                                              Text(if (hindi) "विधानसभा" else "ASSEMBLY", style = MaterialTheme.typography.labelSmall, color = Muted)
                                              Text(assemblies.firstOrNull { it.acNumber == assembly }?.let { it.acNumber + " - " + it.assemblyName } ?: if (hindi) "विधानसभा चुनें" else "Select assembly", color = Navy, fontWeight = FontWeight.Medium)
                                          }
                                          Text("⌄", color = Blue, style = MaterialTheme.typography.titleLarge)
                                      }
                                      DropdownMenu(expanded = assemblyOpen, onDismissRequest = { assemblyOpen = false }, modifier = Modifier.heightIn(max = 320.dp)) {
                                          assemblies.forEach { item ->
                                              DropdownMenuItem(text = { Text(item.acNumber + " - " + item.assemblyName) }, onClick = {
                                                  assembly = item.acNumber; part = ""; parts = emptyList(); rows = emptyList(); hasSearched = false; assemblyOpen = false
                                                  scope.launch { parts = db.dao().partsForAssembly(district, assembly) }
                                              })
                                          }
                                      }
                                  }

                                  Box {
                                      OutlinedButton(onClick = { if (assembly.isNotBlank()) partOpen = true }, enabled = assembly.isNotBlank(), modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp), contentPadding = PaddingValues(horizontal = 12.dp, vertical = 13.dp)) {
                                          Column(modifier = Modifier.weight(1f), horizontalAlignment = Alignment.Start) {
                                              Text(if (hindi) "भाग / मतदान केंद्र" else "PART / POLLING STATION", style = MaterialTheme.typography.labelSmall, color = Muted)
                                              Text(parts.firstOrNull { it.partNo == part }?.let { it.partNo + " - " + it.partName } ?: if (hindi) "भाग चुनें" else "Select part", color = Navy, fontWeight = FontWeight.Medium)
                                          }
                                          Text("⌄", color = Blue, style = MaterialTheme.typography.titleLarge)
                                      }
                                      DropdownMenu(expanded = partOpen, onDismissRequest = { partOpen = false }, modifier = Modifier.heightIn(max = 320.dp)) {
                                          parts.forEach { item ->
                                              DropdownMenuItem(text = { Text(item.partNo + " - " + item.partName) }, onClick = {
                                                  part = item.partNo; rows = emptyList(); hasSearched = false; partOpen = false
                                              })
                                          }
                                      }
                                  }
                                  } else {
                                  Box {
                                      OutlinedButton(onClick = { if (district.isNotBlank()) assemblyOpen = true }, enabled = district.isNotBlank(), modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp), contentPadding = PaddingValues(horizontal = 12.dp, vertical = 13.dp)) {
                                          Column(modifier = Modifier.weight(1f), horizontalAlignment = Alignment.Start) {
                                              Text(if (hindi) "विधानसभा *" else "ASSEMBLY *", style = MaterialTheme.typography.labelSmall, color = Muted)
                                              Text(assembly.ifBlank { if (hindi) "विधानसभा चुनें" else "Select assembly" }, color = Navy, fontWeight = FontWeight.Medium)
                                          }
                                          Text("⌄", color = Blue, style = MaterialTheme.typography.titleLarge)
                                      }
                                      DropdownMenu(expanded = assemblyOpen, onDismissRequest = { assemblyOpen = false }, modifier = Modifier.heightIn(max = 320.dp)) {
                                          eroAssemblies.forEach { item ->
                                              DropdownMenuItem(text = { Text(item) }, onClick = {
                                                  assembly = item; rows = emptyList(); matchingTotal = 0; hasSearched = false; assemblyOpen = false
                                              })
                                          }
                                      }
                                  }
                                  }

                                  OutlinedTextField(
                                      value = query,
                                      onValueChange = { query = it; rows = emptyList(); hasSearched = false },
                                      modifier = Modifier.fillMaxWidth(),
                                      singleLine = true,
                                      shape = RoundedCornerShape(12.dp),
                                      leadingIcon = { Icon(Icons.Default.Search, contentDescription = null, tint = Blue) },
                                      label = { Text(if (selectedTab == "BLO") (if (hindi) "BLO नाम या केंद्र खोजें" else "Search BLO name or polling station") else (if (hindi) "ERO नाम, यूज़र ID या कार्यालय खोजें" else "Search ERO name, user ID or office")) }
                                  )
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                                      Button(onClick = { scope.launch { runSearch(); hasSearched = true; showResults = true } }, modifier = Modifier.weight(1f), shape = RoundedCornerShape(12.dp), contentPadding = PaddingValues(vertical = 12.dp)) {
                                          Icon(Icons.Default.Search, contentDescription = null)
                                          Spacer(Modifier.width(8.dp))
                                          Text(if (hindi) "खोजें" else "Search")
                                      }
                                      OutlinedButton(onClick = {
                                          query = ""; district = ""; assembly = ""; part = ""; assemblies = emptyList(); parts = emptyList()
                                          rows = emptyList(); matchingTotal = 0; hasSearched = false; showResults = false
                                      }, shape = RoundedCornerShape(12.dp), contentPadding = PaddingValues(horizontal = 14.dp, vertical = 12.dp)) {
                                          Text(if (hindi) "रीसेट" else "Reset")
                                      }
                                  }
                              }
                          }

                      }
                      } else {
                          Column(
                              modifier = Modifier.fillMaxSize().padding(inset).padding(horizontal = 16.dp),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth()) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(if (selectedTab == "BLO") (if (hindi) "BLO खोज परिणाम" else "BLO Search Results") else (if (hindi) "ERO खोज परिणाम" else "ERO Search Results"), color = Navy, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleLarge)
                                      Text(if (selectedTab == "BLO") (if (hindi) "BLO संपर्क सूची" else "BLO contact list") else (if (hindi) "विधानसभा स्तर अधिकारी संपर्क सूची" else "Assembly-level officer contact list"), color = Muted, style = MaterialTheme.typography.bodySmall)
                                  }
                                  Surface(color = Color(0xFFE7EEF9), shape = RoundedCornerShape(20.dp)) {
                                      Text(if (hindi) matchingTotal.toString() + " मिले" else matchingTotal.toString() + " found", color = Navy, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp))
                                  }
                              }
                              Surface(color = Color.White, shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                                  Column(Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                                      Text((if (selectedTab == "BLO") listOf(district, assemblies.firstOrNull { it.acNumber == assembly }?.assemblyName.orEmpty(), parts.firstOrNull { it.partNo == part }?.partName.orEmpty()) else listOf(district, assembly)).filter { it.isNotBlank() }.joinToString(" · ").ifBlank { if (hindi) "सभी उपलब्ध क्षेत्र" else "All available areas" }, color = Navy, fontWeight = FontWeight.SemiBold, style = MaterialTheme.typography.bodyMedium)
                                      if (query.isNotBlank()) Text((if (hindi) "खोज: " else "Query: ") + query, color = Muted, style = MaterialTheme.typography.bodySmall)
                                      Text(if (hindi) "दिखाए गए " + rows.size + " / " + matchingTotal else "Showing " + rows.size + " of " + matchingTotal + " matches", color = Muted, style = MaterialTheme.typography.labelSmall)
                                  }
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                                  OutlinedButton(onClick = { showResults = false }, modifier = Modifier.weight(1f), shape = RoundedCornerShape(12.dp)) { Icon(Icons.Default.Tune, contentDescription = null); Spacer(Modifier.width(6.dp)); Text(if (hindi) "फ़िल्टर बदलें" else "Refine Search") }
                                  OutlinedButton(onClick = { query = ""; district = ""; assembly = ""; part = ""; assemblies = emptyList(); parts = emptyList(); rows = emptyList(); matchingTotal = 0; hasSearched = false; showResults = false }, shape = RoundedCornerShape(12.dp)) { Text(if (hindi) "रीसेट" else "Reset") }
                              }
                              if (rows.isEmpty()) {
                                  ElevatedCard(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp)) {
                                      Column(Modifier.fillMaxWidth().padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                          Text(if (hindi) "कोई रिकॉर्ड नहीं मिला" else "No records found", color = Navy, fontWeight = FontWeight.Bold)
                                          Text(if (hindi) "कृपया फ़िल्टर या खोज शब्द बदलें।" else "Try changing your filters or search terms.", color = Muted)
                                          Button(onClick = { showResults = false }, shape = RoundedCornerShape(12.dp)) { Text(if (hindi) "वापस जाएँ" else "Back to Search") }
                                      }
                                  }
                              } else {
                                  LazyColumn(modifier = Modifier.fillMaxWidth().weight(1f), verticalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(bottom = 16.dp)) {
                                      items(items = rows, key = { it.id }) { record ->
                                          ElevatedCard(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp), colors = CardDefaults.elevatedCardColors(containerColor = Color.White), elevation = CardDefaults.elevatedCardElevation(defaultElevation = 2.dp)) {
                                              Column(Modifier.fillMaxWidth().padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                                      Surface(color = Navy, shape = RoundedCornerShape(12.dp), modifier = Modifier.size(44.dp)) {
                                                          Box(contentAlignment = Alignment.Center) { Text(record.bloName.trim().firstOrNull()?.uppercaseChar()?.toString() ?: "B", color = Color.White, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleLarge) }
                                                      }
                                                      Spacer(Modifier.width(10.dp))
                                                      Column(modifier = Modifier.weight(1f)) {
                                                          Text(record.bloName.ifBlank { if (hindi) "नाम उपलब्ध नहीं" else "Name unavailable" }, color = Navy, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleMedium)
                                                          Text(record.designation.ifBlank { if (hindi) "बूथ लेवल अधिकारी" else "Booth Level Officer" }, color = Muted, style = MaterialTheme.typography.bodySmall)
                                                      }
                                                      Surface(color = Color(0xFFFFF1D6), shape = RoundedCornerShape(8.dp)) { Text(selectedTab, color = NavyDark, fontWeight = FontWeight.ExtraBold, modifier = Modifier.padding(horizontal = 8.dp, vertical = 5.dp), style = MaterialTheme.typography.labelSmall) }
                                                  }
                                                  HorizontalDivider(color = Color(0xFFE8EEF2))
                                                  Text(record.partName.ifBlank { if (hindi) "मतदान केंद्र का नाम उपलब्ध नहीं" else "Polling station name unavailable" }, color = NavyDark, fontWeight = FontWeight.SemiBold, style = MaterialTheme.typography.titleSmall)
                                                  Text((if (selectedTab == "BLO") (if (hindi) "भाग संख्या " else "PART NO. ") else (if (hindi) "यूज़र ID " else "USER ID ")) + record.partNo, color = Blue, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.labelMedium)
                                                  Text(record.district + " · " + record.acNumber + " " + record.assemblyName, color = Muted, style = MaterialTheme.typography.bodySmall)
                                                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                                                      Column(modifier = Modifier.weight(1f)) {
                                                          Text(if (hindi) "मोबाइल नंबर" else "MOBILE NUMBER", color = Muted, style = MaterialTheme.typography.labelSmall)
                                                          Text(record.mobileNumber.ifBlank { if (hindi) "उपलब्ध नहीं" else "Not available" }, color = Navy, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleSmall)
                                                          if (selectedTab == "ERO" && record.landline.isNotBlank()) Text((if (hindi) "लैंडलाइन: " else "Landline: ") + record.landline, color = Muted, style = MaterialTheme.typography.bodySmall)
                                                          if (selectedTab == "ERO" && record.email.isNotBlank()) Text(record.email, color = Blue, style = MaterialTheme.typography.bodySmall)
                                                      }
                                                      if (record.mobileNumber.isNotBlank()) {
                                                          Button(onClick = { context.startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(record.mobileNumber)))) }, shape = RoundedCornerShape(10.dp), contentPadding = PaddingValues(horizontal = 12.dp, vertical = 10.dp)) {
                                                              Icon(Icons.Default.Call, contentDescription = null)
                                                              Spacer(Modifier.width(4.dp))
                                                              Text(if (hindi) "कॉल" else "Call")
                                                          }
                                                      }
                                                      OutlinedButton(onClick = {
                                                          val destination = listOf(record.partName, record.assemblyName, record.district, "Rajasthan").filter { it.isNotBlank() }.joinToString(", ")
                                                          context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/maps/search/?api=1&query=" + Uri.encode(destination))))
                                                      }, shape = RoundedCornerShape(10.dp), contentPadding = PaddingValues(horizontal = 10.dp, vertical = 10.dp)) { Text(if (hindi) "दिशाएँ" else "Directions") }
                                                  }
                                              }
                                          }
                                      }
                                      if (rows.size < matchingTotal) {
                                          item(key = "load-more") {
                                              OutlinedButton(onClick = { scope.launch {
                                                  val offset = rows.size
                                                  val next = if (selectedTab == "BLO") {
                                                      db.dao().search(query.trim(), district, assembly, part, 150, offset)
                                                  } else {
                                                      db.dao().searchEro(query.trim(), district, assembly, 150, offset).map { ero ->
                                                          BloRecord(id=ero.id, district=ero.district, acNumber="", assemblyName=ero.assembly, partNo=ero.userId, partName=ero.officeAddress, bloName=ero.name, designation="Electoral Registration Officer (ERO)", mobileNumber=ero.mobile, email=ero.email, landline=ero.landline)
                                                      }
                                                  }
                                                  rows = rows + next
                                              } }, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp)) {
                                                  Text(if (hindi) "और परिणाम लोड करें (" + (matchingTotal - rows.size) + " शेष)" else "Load more (" + (matchingTotal - rows.size) + " remaining)")
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          KOTLIN
          cat > "$DB" <<'KOTLIN'
          package com.rajasthan.election.blo
          import android.content.Context
          import androidx.room.*
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          @Entity(tableName="blo_records", indices=[Index("district"),Index("assemblyName"),Index("partNo"),Index("bloName")])
          data class BloRecord(
           @PrimaryKey val id:String,
           val district:String,
           val acNumber:String,
           val assemblyName:String,
           val partNo:String,
           val partName:String,
           val bloName:String,
           val designation:String,
           val mobileNumber:String = "",
           val email:String = "",
           val landline:String = "",
           val updatedAt:Long = 0L
          )

          @Entity(tableName="ero_records", indices=[Index("district"),Index("assembly"),Index("name")])
          data class EroRecord(
           @PrimaryKey val id:String,
           val name:String,
           val userId:String,
           val status:String,
           val officerType:String,
           val district:String,
           val assembly:String,
           val officeAddress:String,
           val mobile:String,
           val landline:String,
           val email:String
          )

          data class AssemblyOption(val acNumber:String, val assemblyName:String)
          data class PartOption(val partNo:String, val partName:String)

          @Dao interface BloDao {
           @Query("SELECT COUNT(*) FROM blo_records WHERE (:q='' OR lower(bloName) LIKE '%'||lower(:q)||'%' OR lower(partName) LIKE '%'||lower(:q)||'%' OR partNo LIKE '%'||:q||'%' OR lower(assemblyName) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district)) AND (:ac='' OR acNumber=:ac) AND (:part='' OR partNo=:part)") suspend fun countSearch(q:String,district:String,ac:String,part:String):Int
           @Query("SELECT * FROM blo_records WHERE (:q='' OR lower(bloName) LIKE '%'||lower(:q)||'%' OR lower(partName) LIKE '%'||lower(:q)||'%' OR partNo LIKE '%'||:q||'%' OR lower(assemblyName) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district)) AND (:ac='' OR acNumber=:ac) AND (:part='' OR partNo=:part) ORDER BY district,assemblyName,partNo LIMIT :limit OFFSET :offset")
           suspend fun search(q:String,district:String,ac:String,part:String,limit:Int,offset:Int):List<BloRecord>
           @Query("SELECT DISTINCT district FROM blo_records WHERE district!='' ORDER BY district") suspend fun districts():List<String>
           @Query("SELECT DISTINCT acNumber, assemblyName FROM blo_records WHERE lower(district)=lower(:district) ORDER BY CAST(acNumber AS INTEGER), assemblyName") suspend fun assembliesForDistrict(district:String):List<AssemblyOption>
           @Query("SELECT DISTINCT partNo, partName FROM blo_records WHERE lower(district)=lower(:district) AND acNumber=:ac ORDER BY CAST(partNo AS INTEGER), partName") suspend fun partsForAssembly(district:String,ac:String):List<PartOption>
           @Query("SELECT COUNT(*) FROM blo_records") suspend fun count():Int
           @Query("SELECT COUNT(*) FROM ero_records") suspend fun countEro():Int
           @Query("SELECT DISTINCT district FROM ero_records WHERE district!='' ORDER BY district COLLATE NOCASE") suspend fun eroDistricts():List<String>
           @Query("SELECT DISTINCT assembly FROM ero_records WHERE lower(district)=lower(:district) AND assembly!='' ORDER BY assembly COLLATE NOCASE") suspend fun eroAssembliesForDistrict(district:String):List<String>
           @Query("SELECT COUNT(*) FROM ero_records WHERE (:q='' OR lower(name) LIKE '%'||lower(:q)||'%' OR lower(userId) LIKE '%'||lower(:q)||'%' OR lower(mobile) LIKE '%'||lower(:q)||'%' OR lower(officeAddress) LIKE '%'||lower(:q)||'%' OR lower(email) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district)) AND (:assembly='' OR lower(assembly)=lower(:assembly))") suspend fun countEroSearch(q:String,district:String,assembly:String):Int
           @Query("SELECT * FROM ero_records WHERE (:q='' OR lower(name) LIKE '%'||lower(:q)||'%' OR lower(userId) LIKE '%'||lower(:q)||'%' OR lower(mobile) LIKE '%'||lower(:q)||'%' OR lower(officeAddress) LIKE '%'||lower(:q)||'%' OR lower(email) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district)) AND (:assembly='' OR lower(assembly)=lower(:assembly)) ORDER BY district,assembly,name LIMIT :limit OFFSET :offset") suspend fun searchEro(q:String,district:String,assembly:String,limit:Int,offset:Int):List<EroRecord>
           @Insert(onConflict=OnConflictStrategy.REPLACE) suspend fun upsertAll(rows:List<BloRecord>)
           @Insert(onConflict=OnConflictStrategy.REPLACE) suspend fun upsertEroAll(rows:List<EroRecord>)
          }
          @Database(entities=[BloRecord::class,EroRecord::class],version=4,exportSchema=true)
          abstract class BloDatabase:RoomDatabase(){
           abstract fun dao():BloDao
           companion object { @Volatile private var instance:BloDatabase?=null
            fun get(c:Context):BloDatabase=instance?: synchronized(this){instance?:Room.databaseBuilder(c.applicationContext,BloDatabase::class.java,"rajasthan_blo.db").fallbackToDestructiveMigration().build().also{instance=it}}
           }
          }
          suspend fun seedFromAssets(c:Context,db:BloDatabase)=withContext(Dispatchers.IO){
           if(db.dao().count()>0)return@withContext
           c.assets.open("blo_directory.csv").bufferedReader(Charsets.UTF_8).useLines{lines->
            val it=lines.iterator();if(it.hasNext())it.next()
            val batch=mutableListOf<BloRecord>()
            var sourceRowNumber=0L
            while(it.hasNext()){
             val f=parseCsv(it.next())
             if(f.size>=8){
              // Use a unique source-row ID so duplicate-looking records are never overwritten.
              val id="source-row-${sourceRowNumber++}"
              batch.add(BloRecord(id,f[0],f[1],f[2],f[3],f[4],f[5],f[6],f[7]))
              if(batch.size>=1500){db.dao().upsertAll(batch.toList());batch.clear()}
             }
            }
            if(batch.isNotEmpty())db.dao().upsertAll(batch)
           }
          }
          suspend fun seedEroFromAssets(c:Context,db:BloDatabase)=withContext(Dispatchers.IO){
           if(db.dao().countEro()>0)return@withContext
           c.assets.open("ero_directory.csv").bufferedReader(Charsets.UTF_8).useLines{lines->
            val it=lines.iterator();if(it.hasNext())it.next()
            val batch=mutableListOf<EroRecord>()
            var sourceRowNumber=0L
            while(it.hasNext()){
             val f=parseCsv(it.next())
             if(f.size>=10){
              val id="ero-source-row-${sourceRowNumber++}"
              batch.add(EroRecord(id,f[0],f[1],f[2],f[3],f[4],f[5],f[6],f[7],f[8],f[9]))
              if(batch.size>=500){db.dao().upsertEroAll(batch.toList());batch.clear()}
             }
            }
            if(batch.isNotEmpty())db.dao().upsertEroAll(batch)
           }
          }
          fun parseCsv(s:String):List<String>{val a=mutableListOf<String>();val b=StringBuilder();var q=false;var i=0
           while(i<s.length){val c=s[i];if(c=='"'){if(q&&i+1<s.length&&s[i+1]=='"'){b.append('"');i++}else q=!q}else if(c==','&&!q){a.add(b.toString());b.clear()}else b.append(c);i++};a.add(b.toString());return a}
          KOTLIN
          cat >> "$APP_DIR/build.gradle.kts" <<'GRADLE'
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          GRADLE
          echo "Source checks:"
          grep -n '^package ' "$MAIN" "$DB"
          grep -n 'namespace\|applicationId\|sourceCompatibility\|targetCompatibility' "$APP_DIR/build.gradle.kts"
          wc -l "$APP_DIR/src/main/assets/blo_directory.csv"
          test "$(head -n 1 "$APP_DIR/src/main/assets/blo_directory.csv")" = "District,AC Number,Assembly Name,Part No,Part Name,BLO Name,Designation,MobileNumber"

      - name: Build debug APK
        run: gradle -p "$ANDROID_PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK exists, is non-empty, and is a valid ZIP archive."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rajasthan-BLO-Directory-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
