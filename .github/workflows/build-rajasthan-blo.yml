          cat > "$DB" <<'KOTLIN'
          package com.rajasthan.election.blo
          import android.content.Context
          import androidx.room.*
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          @Entity(tableName="blo_records", indices=[Index("district"),Index("assemblyName"),Index("partNo"),Index("bloName")])
          data class BloRecord(
           @PrimaryKey val id:String,
           val district:String,
           val acNumber:String,
           val assemblyName:String,
           val partNo:String,
           val partName:String,
           val bloName:String,
           val designation:String,
           val mobileNumber:String = "",
           val email:String = "",
           val landline:String = "",
           val updatedAt:Long = 0L
          )

          @Entity(tableName="ero_records", indices=[Index("district"),Index("assembly"),Index("name")])
          data class EroRecord(
           @PrimaryKey val id:String,
           val name:String,
           val userId:String,
           val status:String,
           val officerType:String,
           val district:String,
           val assembly:String,
           val officeAddress:String,
           val mobile:String,
           val landline:String,
           val email:String
          )

          data class AssemblyOption(val acNumber:String, val assemblyName:String)
          data class PartOption(val partNo:String, val partName:String)

          @Dao interface BloDao {
           @Query("SELECT COUNT(*) FROM blo_records WHERE (:q='' OR lower(bloName) LIKE '%'||lower(:q)||'%' OR lower(partName) LIKE '%'||lower(:q)||'%' OR partNo LIKE '%'||:q||'%' OR lower(assemblyName) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district)) AND (:ac='' OR acNumber=:ac) AND (:part='' OR partNo=:part)") suspend fun countSearch(q:String,district:String,ac:String,part:String):Int
           @Query("SELECT * FROM blo_records WHERE (:q='' OR lower(bloName) LIKE '%'||lower(:q)||'%' OR lower(partName) LIKE '%'||lower(:q)||'%' OR partNo LIKE '%'||:q||'%' OR lower(assemblyName) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district)) AND (:ac='' OR acNumber=:ac) AND (:part='' OR partNo=:part) ORDER BY district,assemblyName,partNo LIMIT :limit OFFSET :offset")
           suspend fun search(q:String,district:String,ac:String,part:String,limit:Int,offset:Int):List<BloRecord>
           @Query("SELECT DISTINCT district FROM blo_records WHERE district!='' ORDER BY district") suspend fun districts():List<String>
           @Query("SELECT DISTINCT acNumber, assemblyName FROM blo_records WHERE lower(district)=lower(:district) ORDER BY CAST(acNumber AS INTEGER), assemblyName") suspend fun assembliesForDistrict(district:String):List<AssemblyOption>
           @Query("SELECT DISTINCT partNo, partName FROM blo_records WHERE lower(district)=lower(:district) AND acNumber=:ac ORDER BY CAST(partNo AS INTEGER), partName") suspend fun partsForAssembly(district:String,ac:String):List<PartOption>
           @Query("SELECT COUNT(*) FROM blo_records") suspend fun count():Int
           @Query("SELECT COUNT(*) FROM ero_records WHERE upper(officerType)='ERO'") suspend fun countEro():Int
           @Query("SELECT COUNT(*) FROM ero_records WHERE upper(officerType)=upper(:type)") suspend fun countOfficer(type:String):Int
           @Query("SELECT DISTINCT district FROM ero_records WHERE district!='' AND upper(officerType)=upper(:type) ORDER BY district COLLATE NOCASE") suspend fun officerDistricts(type:String):List<String>
           @Query("SELECT DISTINCT district FROM ero_records WHERE district!='' AND upper(officerType)='ERO' ORDER BY district COLLATE NOCASE") suspend fun eroDistricts():List<String>
           @Query("SELECT DISTINCT assembly FROM ero_records WHERE lower(district)=lower(:district) AND assembly!='' AND upper(officerType)='ERO' ORDER BY assembly COLLATE NOCASE") suspend fun eroAssembliesForDistrict(district:String):List<String>
           @Query("SELECT COUNT(*) FROM ero_records WHERE upper(officerType)='ERO' AND (:q='' OR lower(name) LIKE '%'||lower(:q)||'%' OR lower(mobile) LIKE '%'||lower(:q)||'%' OR lower(officeAddress) LIKE '%'||lower(:q)||'%' OR lower(email) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district)) AND (:assembly='' OR lower(assembly)=lower(:assembly))") suspend fun countEroSearch(q:String,district:String,assembly:String):Int
           @Query("SELECT * FROM ero_records WHERE upper(officerType)='ERO' AND (:q='' OR lower(name) LIKE '%'||lower(:q)||'%' OR lower(mobile) LIKE '%'||lower(:q)||'%' OR lower(officeAddress) LIKE '%'||lower(:q)||'%' OR lower(email) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district)) AND (:assembly='' OR lower(assembly)=lower(:assembly)) ORDER BY district,assembly,name LIMIT :limit OFFSET :offset") suspend fun searchEro(q:String,district:String,assembly:String,limit:Int,offset:Int):List<EroRecord>
           @Query("SELECT COUNT(*) FROM ero_records WHERE upper(officerType)=upper(:type) AND (:q='' OR lower(name) LIKE '%'||lower(:q)||'%' OR lower(mobile) LIKE '%'||lower(:q)||'%' OR lower(officeAddress) LIKE '%'||lower(:q)||'%' OR lower(email) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district))") suspend fun countOfficerSearch(q:String,district:String,type:String):Int
           @Query("SELECT * FROM ero_records WHERE upper(officerType)=upper(:type) AND (:q='' OR lower(name) LIKE '%'||lower(:q)||'%' OR lower(mobile) LIKE '%'||lower(:q)||'%' OR lower(officeAddress) LIKE '%'||lower(:q)||'%' OR lower(email) LIKE '%'||lower(:q)||'%') AND (:district='' OR lower(district)=lower(:district)) ORDER BY district,name LIMIT :limit OFFSET :offset") suspend fun searchOfficer(q:String,district:String,type:String,limit:Int,offset:Int):List<EroRecord>
           @Insert(onConflict=OnConflictStrategy.REPLACE) suspend fun upsertAll(rows:List<BloRecord>)
           @Insert(onConflict=OnConflictStrategy.REPLACE) suspend fun upsertEroAll(rows:List<EroRecord>)
           @Query("DELETE FROM blo_records") suspend fun deleteAllBlo()
           @Query("DELETE FROM ero_records WHERE upper(officerType)=upper(:type)") suspend fun deleteOfficerType(type:String)
           @Transaction suspend fun replaceBlo(rows:List<BloRecord>) { deleteAllBlo(); rows.chunked(1000).forEach { upsertAll(it) } }
           @Transaction suspend fun replaceOfficerType(type:String,rows:List<EroRecord>) { deleteOfficerType(type); rows.chunked(500).forEach { upsertEroAll(it) } }
          }

          @Database(entities=[BloRecord::class,EroRecord::class],version=5,exportSchema=true)
          abstract class BloDatabase:RoomDatabase(){
           abstract fun dao():BloDao
           companion object { @Volatile private var instance:BloDatabase?=null
            fun get(c:Context):BloDatabase=instance?: synchronized(this){instance?:Room.databaseBuilder(c.applicationContext,BloDatabase::class.java,"rajasthan_blo.db").fallbackToDestructiveMigration().build().also{instance=it}}
           }
          }
          suspend fun seedFromAssets(c:Context,db:BloDatabase)=withContext(Dispatchers.IO){
           if(db.dao().count()>0)return@withContext
           c.assets.open("blo_directory.csv").bufferedReader(Charsets.UTF_8).useLines{lines->
            val it=lines.iterator();if(it.hasNext())it.next()
            val batch=mutableListOf<BloRecord>()
            var sourceRowNumber=0L
            while(it.hasNext()){
             val f=parseCsv(it.next())
             if(f.size>=8){
              // Use a unique source-row ID so duplicate-looking records are never overwritten.
              val id="source-row-${sourceRowNumber++}"
              batch.add(BloRecord(id,f[0],f[1],f[2],f[3],f[4],f[5],f[6],f[7]))
              if(batch.size>=1500){db.dao().upsertAll(batch.toList());batch.clear()}
             }
            }
            if(batch.isNotEmpty())db.dao().upsertAll(batch)
           }
          }
          suspend fun seedOfficerFromAssets(c:Context,db:BloDatabase,assetName:String,type:String)=withContext(Dispatchers.IO){
           if(db.dao().countOfficer(type)>0)return@withContext
           c.assets.open(assetName).bufferedReader(Charsets.UTF_8).useLines{lines->
            val it=lines.iterator();if(it.hasNext())it.next()
            val batch=mutableListOf<EroRecord>()
            var sourceRowNumber=0L
            while(it.hasNext()){
             val f=parseCsv(it.next())
             if(f.size>=10){
              val id="${type.lowercase()}-source-row-${sourceRowNumber++}"
              batch.add(EroRecord(id,f[0],f[1],f[2],f[3],f[4],f[5],f[6],f[7],f[8],f[9]))
              if(batch.size>=500){db.dao().upsertEroAll(batch.toList());batch.clear()}
             }
            }
            if(batch.isNotEmpty())db.dao().upsertEroAll(batch)
           }
          }
          fun parseCsv(s:String):List<String>{val a=mutableListOf<String>();val b=StringBuilder();var q=false;var i=0
            while(i<s.length){val c=s[i];if(c=='"'){if(q&&i+1<s.length&&s[i+1]=='"'){b.append('"');i++}else q=!q}else if(c==','&&!q){a.add(b.toString());b.clear()}else b.append(c);i++};a.add(b.toString());return a}
           private fun normKey(v:String)=v.lowercase(Locale.ROOT).filter{it.isLetterOrDigit()}
           private fun JSONObject.field(vararg aliases:String):String { val a=aliases.map{normKey(it)}.toSet(); val it=keys(); while(it.hasNext()){val k=it.next();if(normKey(k) in a){val v=opt(k);if(v!=null&&v!=JSONObject.NULL)return v.toString().trim()}};return "" }
           private fun parseRows(text:String):List<JSONObject>{val root=org.json.JSONTokener(text).nextValue();val a=when(root){is JSONArray->root;is JSONObject->{var x:JSONArray?=null;for(k in listOf("data","records","items","results","BLO","ERO","DEO","DyDEO","directory")){val v=root.opt(k);if(v is JSONArray){x=v;break}};x?:throw IllegalArgumentException("Expected JSON array or data/records array")};else->throw IllegalArgumentException("Unexpected JSON root")};if(a.length()==0)throw IllegalArgumentException("Empty directory response");return (0 until a.length()).map{a.optJSONObject(it)?:throw IllegalArgumentException("Invalid record at row "+(it+1))}}
           suspend fun syncDirectory(db:BloDatabase,label:String,type:String,url:String):String=withContext(Dispatchers.IO){
            val c=(URL(url).openConnection() as HttpURLConnection).apply{requestMethod="GET";connectTimeout=20000;readTimeout=45000;setRequestProperty("Accept","application/json");setRequestProperty("Cache-Control","no-cache")}
            try{if(c.responseCode !in 200..299)throw IllegalStateException("HTTP "+c.responseCode);val text=c.inputStream.bufferedReader(Charsets.UTF_8).use{it.readText()};val rows=parseRows(text)
             if(type=="BLO"){val data=rows.mapIndexed{i,o->val d=o.field("District","District Name");val ac=o.field("AC Number","AC No","Assembly Number","Assembly No","ACNumber");val an=o.field("Assembly Name","Assembly","AC Name","Constituency","AC Name (English)");val p=o.field("Part No","Part Number","Part No.","Part");val pn=o.field("Part Name","Polling Station","Polling Station Name","Part Name (English)");val n=o.field("BLO Name","Name","User Name","Officer Name");if(d.isBlank()||(ac.isBlank()&&an.isBlank())||p.isBlank()||n.isBlank())throw IllegalArgumentException("BLO row "+(i+1)+" missing required fields");BloRecord(listOf(d,ac,p).joinToString("|"),d,ac,an,p,pn,n,o.field("Designation","Officer Type","Role"),o.field("MobileNumber","Mobile Number","Mobile No","Mobile","User Id","Contact Number","Phone"),o.field("Email","E-mail","Email Id"),o.field("Landline","Land Line"),System.currentTimeMillis())};if(data.size<1000)throw IllegalArgumentException("Only "+data.size+" BLO records; keeping existing data");if(data.map{it.id}.toSet().size!=data.size)throw IllegalArgumentException("Duplicate BLO district/assembly/part keys");db.dao().replaceBlo(data);"✓ BLO: "+data.size+" records synced"
             }else{val data=rows.mapIndexed{i,o->val n=o.field("Name","User Name","Officer Name","OfficerName");val d=o.field("District","District Name");val a=o.field("Assembly","Assembly Name","Constituency","AC Name");val office=o.field("Office Address","Office","Address","Office Location");val mobile=o.field("Mobile No.","Mobile Number","MobileNumber","Mobile","Contact Number","User Id");if(n.isBlank()||d.isBlank())throw IllegalArgumentException(label+" row "+(i+1)+" missing name/district");val ot=type;EroRecord(listOf(type,d,a,n,mobile,office).joinToString("|"),n,o.field("User Id","UserID","User Id."),o.field("Status"),ot,d,a,office,mobile,o.field("Landline","Land Line","Office Phone"),o.field("E-mail","Email","Email Id"))};val min=if(type=="ERO")20 else 10;if(data.size<min)throw IllegalArgumentException("Only "+data.size+" "+label+" records; keeping existing data");if(data.map{it.id}.toSet().size!=data.size)throw IllegalArgumentException("Duplicate "+label+" keys");db.dao().replaceOfficerType(type,data); "✓ "+label+": "+data.size+" records synced"}
            }finally{c.disconnect()}
           }
          KOTLIN
          cat >> "$APP_DIR/build.gradle.kts" <<'GRADLE'
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          GRADLE
          echo "Source checks:"
          grep -n '^package ' "$MAIN" "$DB"
          grep -n 'namespace\|applicationId\|sourceCompatibility\|targetCompatibility' "$APP_DIR/build.gradle.kts"
          wc -l "$APP_DIR/src/main/assets/blo_directory.csv"
          test "$(head -n 1 "$APP_DIR/src/main/assets/blo_directory.csv")" = "District,AC Number,Assembly Name,Part No,Part Name,BLO Name,Designation,MobileNumber"

      - name: Build debug APK
        run: gradle -p "$ANDROID_PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK exists, is non-empty, and is a valid ZIP archive."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rajasthan-BLO-Directory-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
